<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Diezmos y Ofrendas — ICC La Trinidad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="media/logo-favicon.png" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="antialiased text-gray-800">
    <div data-site-header></div>
    <main class="max-w-6xl mx-auto p-6">
        <section class="card">
            <h2 class="text-2xl font-semibold">Diezmos y Ofrendas</h2>
            <p class="mt-2 text-sm">Tu aporte ayuda a sostener la obra y los ministerios.</p>
            <div class="mt-4 md:flex gap-6">
                <form id="donationForm" class="bg-gray-50 p-6 rounded shadow max-w-md w-full">
                    <label class="block text-sm font-medium">Selecciona Monto</label>
                    <div class="mt-3 flex gap-2">
                        <button type="button" class="preset px-3 py-2 border rounded"
                            data-amount="10000">$10.000</button>
                        <button type="button" class="preset px-3 py-2 border rounded"
                            data-amount="20000">$20.000</button>
                        <button type="button" class="preset px-3 py-2 border rounded"
                            data-amount="50000">$50.000</button>
                    </div>
                    <div class="mt-4"><label class="block text-sm">Otro monto</label><input id="amount" type="number"
                            min="1" class="mt-2 w-full p-2 border rounded" placeholder="Ingrese monto en COP" /></div>
                    <div class="mt-4"><label class="block text-sm">Nombre</label><input id="donorName" type="text"
                            class="mt-2 w-full p-2 border rounded" required /></div>
                    <div class="mt-4"><button type="submit" class="w-full btn-primary">Donar ahora</button></div>
                </form>
                <div class="flex-1">
                    <h4 class="font-semibold">Cómo funciona</h4>
                    <p class="mt-2 text-sm text-gray-600">La experiencia de donación es clara y segura. En producción
                        integraremos Stripe/PayU.</p>
                    <div class="mt-4 p-4 bg-white rounded shadow">
                        <div id="summary">Monto: - | Donante: -</div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div data-site-footer></div>
    <script src="site-chrome.js"></script>
    <script src="scripts.js"></script>
</body>

</html>
