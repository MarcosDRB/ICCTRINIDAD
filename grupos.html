<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Grupos — ICC La Trinidad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="media/logo-favicon.png" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="antialiased text-gray-800">
    <div data-site-header></div>
    <main class="max-w-6xl mx-auto p-6">
        <section class="card">
            <h2 class="text-2xl font-semibold">Grupos y Equipos</h2>
            <p class="mt-2 text-sm">Galería de fotos de los grupos de niños, jóvenes y ministerios.</p>
            <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="photo-card no-lightbox"><img class="person-photo" src="https://icclatrinidad.com/imagenes/IMG_0197.jpg" alt="Grupo niños" /><div class="person-caption">Grupo de niños</div></div>
                <div class="photo-card no-lightbox"><img class="person-photo" src="https://icclatrinidad.com/imagenes/IMG_0132.jpg" alt="Grupo jóvenes" /><div class="person-caption">Grupo de jóvenes</div></div>
                <div class="photo-card no-lightbox"><img class="person-photo" src="https://icclatrinidad.com/imagenes/maria.jpg" alt="Ministerio de apoyo" /><div class="person-caption">Ministerio de apoyo</div></div>
                <div class="photo-card no-lightbox"><img class="person-photo" src="https://icclatrinidad.com/imagenes/lizbeth.jpg" alt="Equipo de servicio" /><div class="person-caption">Equipo de servicio</div></div>
            </div>
        </section>
    </main>
    <div data-site-footer></div>

    <div data-image-modal></div>
    <script src="site-chrome.js"></script>
    <script src="scripts.js"></script>
</body>

</html>
