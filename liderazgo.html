<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Liderazgo — ICC La Trinidad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="media/logo-favicon.png" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="antialiased text-gray-800">
    <div data-site-header></div>
    <main class="max-w-6xl mx-auto p-6">
        <section class="card">
            <h2 class="text-2xl font-semibold">Liderazgo</h2>
            <p class="mt-2">Conoce a nuestro equipo de dirección.</p>
            <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-4">
                <button class="leader-card" data-name="Pastor Jhon" data-role="Pastor Principal"
                    data-bio="Apasionado por enseñar."><img class="person-photo rounded"
                        src="https://icclatrinidad.com/imagenes/IMG_0197.jpg" /></button>
                <button class="leader-card" data-name="Pastora Katie" data-role="Pastora"
                    data-bio="Su corazón por las familias."><img class="person-photo rounded"
                        src="https://icclatrinidad.com/imagenes/IMG_0132.jpg" /></button>
                <button class="leader-card" data-name="Harold" data-role="Servidor"
                    data-bio="Servidor comprometido."><img class="person-photo rounded"
                        src="https://icclatrinidad.com/imagenes/harold.jpg" /></button>
                <button class="leader-card" data-name="Maria" data-role="Servidora" data-bio="Ama servir."><img
                        class="person-photo rounded" src="https://icclatrinidad.com/imagenes/maria.jpg" /></button>
            </div>
        </section>
    </main>
    <div data-site-footer></div>
    <div data-leader-modal></div>

    <div data-image-modal></div>

    <script src="site-chrome.js"></script>

    <script src="scripts.js"></script>
</body>

</html>
